<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="山手線30駅を歩いて一周する日のための記録アプリ">
<meta name="theme-color" content="#F3F6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F130C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぐるっと山手線">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif;background:#F3F6EE}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>ぐるっと山手線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one column, the loop map is the hero and doubles as the progress ring; next-stop card and stop log below */
:root{
  --bg:#F3F6EE; --surface:#FFFFFF; --fg:#18210F; --muted:#69735F; --rule:#E1E7D8;
  --track:#D9E0CF; --line:#86C232; --ink:#3D6B10; --on-line:#18210F; --warn:#B4472C;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Barlow Semi Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F130C; --surface:#171D13; --fg:#E7EEDD; --muted:#919C86; --rule:#263021;
  --track:#2B3524; --line:#9ACD32; --ink:#B9E36A; --on-line:#0F130C; --warn:#E5785B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F130C; --surface:#171D13; --fg:#E7EEDD; --muted:#919C86; --rule:#263021;
  --track:#2B3524; --line:#9ACD32; --ink:#B9E36A; --on-line:#0F130C; --warn:#E5785B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
/* iPhone（375〜430px幅）を基準に、片手・親指で操作できる配置 */
.wrap{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:10px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
button,label,.st{touch-action:manipulation}
svg,.go,.pause,.add-photo,.trivia{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb, var(--bg) 88%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.actbar .btns{max-width:408px;margin:0 auto}
.actbar .pause{color:var(--fg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none}
.brand h1{font-size:18px;font-weight:900;margin:0;letter-spacing:.04em;line-height:1.2}
.brand p{margin:0;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.icon-btn{border:1px solid var(--rule);background:var(--surface);border-radius:999px;min-height:40px;padding:0 16px;font-size:14px;font-weight:700}

.map{background:var(--surface);border-radius:var(--r);padding:4px 0 0}
.map svg{display:block;width:100%;height:auto;max-width:100%}
.seg{fill:none;stroke:var(--track);stroke-width:9;stroke-linecap:round}
.seg.done{stroke:var(--line)}
.seg.walking{stroke:var(--line);stroke-dasharray:2 7;stroke-width:5}
.st circle.dot{fill:var(--surface);stroke:var(--track);stroke-width:3}
.st.major circle.dot{stroke-width:4}
.st.done circle.dot{fill:var(--line);stroke:var(--surface);stroke-width:2.5}
.st.next circle.dot{stroke:var(--line);stroke-width:3.5}
.st .pulse{fill:none;stroke:var(--line);stroke-width:2;opacity:0}
.st.next .pulse{opacity:.55}
.st .start-ring{fill:none;stroke:var(--fg);stroke-width:2.4;opacity:0}
.st.start .start-ring{opacity:1}
.st.start > text{opacity:0}
.start-flag rect{fill:var(--fg)}
.start-flag .sf-name{font-family:var(--f-body);font-size:13px;font-weight:900;fill:var(--bg)}
.start-flag .sf-cap{font-family:var(--f-num);font-size:9px;font-weight:700;fill:var(--ink);letter-spacing:.14em}
.start-flag{pointer-events:none}
.st text{font-family:var(--f-body);font-size:11px;font-weight:700;fill:var(--muted)}
.st.major text{font-size:13px;font-weight:900;fill:var(--fg)}
.st.done text{fill:var(--ink)}
.st.next text{fill:var(--fg)}
.st .hit{fill:transparent;cursor:pointer}
.st.sel circle.dot{stroke:var(--fg)}
.c-label{font-family:var(--f-body);font-size:10px;font-weight:700;fill:var(--muted);letter-spacing:.12em}
.c-big{font-family:var(--f-num);font-weight:700;font-size:64px;fill:var(--ink)}
.c-name{font-family:var(--f-body)!important;font-weight:900!important;letter-spacing:.04em;font-size:44px}
.c-time{font-family:var(--f-num);font-weight:700;font-size:40px;fill:var(--fg);font-variant-numeric:tabular-nums}
.c-pct2{font-family:var(--f-num);font-weight:700;font-size:30px;fill:var(--ink)}
.c-pct{font-family:var(--f-num);font-weight:700;font-size:17px;fill:var(--ink)}
.c-cnt{font-family:var(--f-num);font-weight:600;font-size:16px;fill:var(--fg)}
.c-of{font-family:var(--f-num);font-weight:600;font-size:20px;fill:var(--muted)}
.c-sub{font-family:var(--f-num);font-weight:600;font-size:22px;fill:var(--fg)}
.c-unit{font-family:var(--f-body);font-weight:700;font-size:9.5px;fill:var(--muted)}
.c-rest{font-family:var(--f-body);font-weight:900;font-size:11px;fill:var(--warn);letter-spacing:.1em}
.c-tag{font-family:var(--f-body);font-weight:700;font-size:10px;fill:var(--ink);letter-spacing:.06em}

.next{background:var(--surface);color:var(--fg);border-radius:var(--r);padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--rule)}
.next .eyebrow{font-size:11.5px;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.next .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.next .name{font-size:32px;font-weight:900;line-height:1.1;letter-spacing:.03em}
.next .name small{display:block;font-family:var(--f-num);font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.leg{display:flex;flex-direction:column;gap:2px;min-width:0}
.leg .from{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--muted)}
.leg .from::after{content:"";flex:none;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--line);opacity:1}
.leg .to{font-size:32px;font-weight:900;line-height:1.1;letter-spacing:.03em;color:var(--fg)}
.leg .to small{display:block;font-family:var(--f-num);font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.to-map{background:none;border:0;padding:0;min-height:44px;color:var(--muted);font-size:12.5px;font-weight:700}
.center-hit{fill:transparent;cursor:pointer}
svg [tabindex]:focus{outline:none}
svg [tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.c-hint{font-family:var(--f-body);font-size:9.5px;font-weight:700;fill:var(--muted);letter-spacing:.06em}
#nextBox{scroll-margin-top:12px}
.svg-cele .seg{animation:glow .7s ease-in-out 4 alternate}
@keyframes glow{to{stroke-width:14;stroke:var(--ink)}}
.cele{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb, var(--bg) 70%, transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .3s ease-out}
.cele .box{text-align:center;display:flex;flex-direction:column;gap:6px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.cele .s1{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.1em}
.cele .s2{font-size:56px;font-weight:900;line-height:1.1;letter-spacing:.04em;color:var(--fg)}
.cele .s3{font-family:var(--f-num);font-size:40px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cele .s4{font-size:12px;color:var(--muted);margin-top:10px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}}
.next .meta{text-align:right;font-size:12px;color:var(--muted)}
.next .meta b{display:block;font-family:var(--f-num);font-size:22px;font-weight:700;color:var(--ink)}
.go{width:100%;border:0;border-radius:14px;background:var(--line);color:var(--on-line);font-size:18px;font-weight:900;min-height:56px;padding:12px;letter-spacing:.06em;transition:transform .12s}
.go:active{transform:scale(.98)}
.btns{display:grid;grid-template-columns:1fr auto;gap:8px}
.pause{border:1.5px solid currentColor;background:none;color:inherit;border-radius:14px;min-width:76px;padding:0 14px;font-weight:900;font-size:14px;letter-spacing:.04em;opacity:.85}
.pause.on{background:var(--warn);border-color:var(--warn);color:#fff;opacity:1}
.rest{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13.5px}
.rest b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:18px}
.next .sub-actions{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.link{background:none;border:0;padding:0;min-height:44px;color:inherit;opacity:.7;text-decoration:underline;text-underline-offset:3px}

.mapbar{padding:4px 12px 12px;display:flex;flex-direction:column;gap:6px}
.mapbar .lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.mapbar .lbls b{font-family:var(--f-num);color:var(--ink);font-size:13px}
.bar{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;height:14px}
.bar i{background:var(--track);border-radius:2px;transition:background-color .4s}
.bar i.on{background:var(--line)}
.bar i.cur{background:var(--track);box-shadow:inset 0 0 0 2px var(--line)}
.bar i:first-child{border-radius:7px 2px 2px 7px}.bar i:last-child{border-radius:2px 7px 7px 2px}
.trivia{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;font-weight:500;border:0;color:var(--fg);text-align:left;width:100%}
.trivia .q{flex:none;font-family:var(--f-num);font-weight:700;font-size:11px;letter-spacing:.1em;background:var(--ink);color:var(--surface);border-radius:4px;padding:1px 6px;margin-top:2px}
.trivia small{display:block;opacity:.55;font-size:11px;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr;gap:8px}
.stats .stat{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.stat b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.stat b small{font-size:12px;color:var(--muted);margin-left:2px}

.panel{background:var(--surface);border-radius:var(--r);padding:16px}
.panel h2{font-size:14px;margin:0 0 10px;letter-spacing:.06em}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:700}
select{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
.seg-ctl{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--rule)}
.seg-ctl button{border:0;background:none;border-radius:8px;padding:9px 6px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.set{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.set-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.set-row select{min-width:0}
.set-row .seg-ctl button{padding:8px 12px;min-height:38px}
.bk-row{display:flex;flex-wrap:wrap;gap:4px 16px}
.bk-row .link{color:var(--ink);font-size:12.5px;min-height:36px;display:inline-flex;align-items:center;cursor:pointer;opacity:1}
.set-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.set-foot .note{margin:0}
#resetBox{margin-left:auto}
.danger{border:0;color:var(--warn);background:none;padding:0;min-height:36px;font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.confirm .yes{background:var(--warn);color:var(--surface);border:0;border-radius:8px;padding:6px 12px;font-weight:700}
.confirm .no{background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 12px}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}

.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;min-height:44px;position:relative}
.log li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:3px;background:var(--track)}
.log li.done::before{background:var(--line)}
.log li:first-child::before{top:50%}
.log li:last-child::before{bottom:50%}
.log .pin{width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--track);justify-self:center;position:relative;z-index:1}
.log li.done .pin{background:var(--line);border-color:var(--line)}
.log li.nextup .pin{border-color:var(--line)}
.log .nm{min-width:0;font-weight:700;font-size:14.5px;line-height:1.3}
.log .nm small{font-family:var(--f-num);font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.04em;margin-left:6px}
.log li:not(.done):not(.nextup) .nm{color:var(--muted);font-weight:500}
.log .tag{display:inline-block;font-size:10px;font-weight:700;background:var(--fg);color:var(--bg);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:2px}
.log .rt{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;line-height:1.25}
.log .rt small{display:block;color:var(--muted);font-size:11px}
.log .rest-pill.stay{color:var(--muted);border-color:var(--rule)}
.log .rest-pill{display:inline-block;font-family:var(--f-body);font-size:10.5px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:0 6px;margin-top:2px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.sheet .card{pointer-events:auto;width:100%;max-width:536px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;box-shadow:0 10px 40px rgb(0 0 0 / .22);display:flex;flex-direction:column;gap:10px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h3{margin:0;font-size:24px;font-weight:900;line-height:1.15}
.sheet h3 small{display:block;font-family:var(--f-num);font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.sheet .x{border:0;background:var(--bg);border-radius:999px;width:32px;height:32px;font-size:16px}
.sheet .info{font-size:13.5px;color:var(--muted)}
.sheet .info b{color:var(--fg)}

.goal{background:var(--line);color:var(--on-line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:6px}
.goal .big{font-size:30px;font-weight:900;letter-spacing:.04em;line-height:1.2}
.goal p{margin:0;font-size:14px;font-weight:700}
.goal{gap:4px!important;padding:20px 18px 14px!important}
.goal .g-eye{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.75}
.goal .g-time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:52px;font-weight:700;line-height:1.05;margin-top:4px}
.goal .g-sub{font-size:12.5px;font-weight:700;opacity:.8}
.goal .card-btn{margin-top:14px}
.g-todo{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid currentColor;background:none;color:inherit;border-radius:12px;min-height:46px;padding:0 14px;font-size:12.5px;margin-top:8px;text-align:left}
.g-todo b{font-weight:700;min-width:0}
.g-todo span{flex:none;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.g-undo{align-self:flex-start;color:inherit;opacity:.7;font-size:12px;margin-top:2px}
.card-btn{border:0;border-radius:14px;background:var(--fg);color:var(--bg);font-size:16px;font-weight:900;min-height:52px;margin-top:10px;letter-spacing:.04em}
.next .meta .eta{display:block;font-size:11.5px;margin-top:2px}
.next .meta .eta b{display:inline;font-size:15px;color:var(--fg)}
.viewer .hint{color:rgb(255 255 255 / .7);font-size:12px;text-align:center;width:100%}
.viewer .vsave{background:#9ACD32;border-color:#9ACD32;color:#0F130C}
.phblock{display:flex;flex-direction:column;gap:6px}
.phlabel{font-size:12px;font-weight:700;color:var(--muted)}
.rv{display:flex;flex-direction:column;gap:14px}
.rv h3{margin:0 0 6px;font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center}
.rank .no{font-family:var(--f-num);font-weight:700;font-size:16px;color:var(--ink);text-align:center}
.rank .nm{min-width:0;font-weight:700;font-size:14px;line-height:1.3}
.rank .nm small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.rank .tr{display:block;height:6px;border-radius:3px;background:var(--track);margin-top:4px;overflow:hidden}
.rank .tr i{display:block;height:100%;background:var(--line);border-radius:3px}
.rank.fast .tr i{background:var(--ink)}
.rank .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.rv .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rv .fact{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);font-weight:700;min-width:0}
.rv .fact b{display:block;color:var(--fg);font-size:14px;line-height:1.35}
.rv .fact.wide{grid-column:1/-1}
.rv .fact b.big{font-family:var(--f-num);font-size:26px;font-variant-numeric:tabular-nums}
.stepbox{background:var(--bg);border-radius:12px;padding:10px 12px}
.stepbox>summary{font-weight:900;font-size:14px;cursor:pointer;min-height:36px;display:flex;align-items:center}
.steps-how{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.steps-how li b{display:block}
.steps-how li span{display:block;color:var(--muted);font-size:12px}
.steps-how textarea,.stout{width:100%;font:inherit;font-size:16px;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--fg);margin-top:6px;resize:vertical}

<script>
// 駅データ（内回り順）。座標は路線図の形を元にした模式図。
const ST = [
 ["東京","Tokyo",1,255,231,"R"],["神田","Kanda",0,267,196,"R"],["秋葉原","Akihabara",0,274,166,"R"],
 ["御徒町","Okachimachi",0,280,138,"R"],["上野","Ueno",1,284,112,"R"],["鶯谷","Uguisudani",0,291,86,"R"],
 ["日暮里","Nippori",0,268,64,"L"],["西日暮里","Nishi-Nippori",0,256,47,"TR"],["田端","Tabata",0,236,29,"T"],
 ["駒込","Komagome",0,204,30,"T"],["巣鴨","Sugamo",0,178,42,"B"],["大塚","Otsuka",0,144,47,"T"],
 ["池袋","Ikebukuro",1,97,56,"TL"],["目白","Mejiro",0,82,90,"L"],["高田馬場","Takadanobaba",0,73,118,"L"],
 ["新大久保","Shin-Okubo",0,64,158,"L"],["新宿","Shinjuku",1,62,198,"L"],["代々木","Yoyogi",0,68,225,"L"],
 ["原宿","Harajuku",0,70,265,"L"],["渋谷","Shibuya",1,66,306,"L"],["恵比寿","Ebisu",0,88,352,"L"],
 ["目黒","Meguro",0,106,398,"L"],["五反田","Gotanda",0,128,428,"L"],["大崎","Osaki",0,150,458,"L"],
 ["品川","Shinagawa",1,174,424,"R"],["高輪ゲートウェイ","Takanawa Gateway",0,182,388,"R"],["田町","Tamachi",0,201,358,"R"],
 ["浜松町","Hamamatsucho",0,226,322,"R"],["新橋","Shimbashi",0,232,286,"R"],["有楽町","Yurakucho",0,245,256,"R"]
];
const N = 30, KEY = "yamanote-walk-v1"; // 保存キーは改名前のまま（記録を引き継ぐため）

let S = {start:0, dir:"inner", checks:[], pauses:[]};
try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.checks)) S = Object.assign({pauses:[]}, s); }catch(e){}
// テストモード中は時計を早送りできる（S.tOff ミリ秒ぶん先の時刻を「いま」とみなす）
const now = () => Date.now() + (S.test ? (S.tOff||0) : 0);
if(!S.mood) S.mood = {};
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const route = () => Array.from({length:N+1}, (_,k) => S.dir==="inner" ? (S.start+k)%N : (S.start-k+N)%N);
const segIdx = k => { const r = route(); return S.dir==="inner" ? r[k] : r[k+1]; }; // segment between stop k and k+1
// 経過時間は休憩込み。休憩は区間ごとに記録して振り返りに使う
const paused = () => { const p=S.pauses[S.pauses.length-1]; return !!(p && p.e==null); };
const restBefore = t => S.pauses.reduce((a,p)=>a+Math.max(0,Math.min(p.e??t,t)-Math.min(p.s,t)),0);
const elapsed = t => S.checks.length ? t - S.checks[0] : 0;
const restIn = (a,b) => S.pauses.reduce((x,p)=>x+Math.max(0,Math.min(p.e??now(),b)-Math.max(p.s,a)),0);
const nowT = () => finished() ? S.checks[N] : now();
const curRest = () => { const p=S.pauses[S.pauses.length-1]; return p && p.e==null ? now()-p.s : 0; };
const fmtT = ts => { const d=new Date(ts); return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"); };
const fmtDur = ms => { const s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return h+":"+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
// ゴール予想時刻：これまでの1駅あたりの平均（休憩込み）で残りの駅数を歩いた場合
const etaGoal = () => { const n=S.checks.length; if(n<3 || finished()) return null;
  const last=S.checks[n-1], avg=(last-S.checks[0])/(n-1); return last + avg*(N-(n-1)); };
// 歩数（ショートカットで取り込んだ区間ごとの歩数。S.steps[k] = k番目の到着から次の到着まで）
const stepsTotal = () => Array.isArray(S.steps) && S.steps.some(v=>v!=null) ? S.steps.reduce((a,v)=>a+(v||0),0) : null;
const fmtNum = v => Number(v).toLocaleString("ja-JP");
const fmtStamp = ts => { const d=new Date(ts), z=x=>String(x).padStart(2,"0"); return `${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
const fmtMin = ms => { const m=Math.round(ms/60000); return m>=60 ? Math.floor(m/60)+"時間"+(m%60)+"分" : m+"分"; };
const started = () => S.checks.length>0, finished = () => S.checks.length===N+1;
// 駅に着いてから「出発」を押すまでは駅に滞在中（タイマーは次の区間に進まない）
if(!S.deps){ S.deps={}; S.checks.forEach((t,k)=>{ if(k<N) S.deps[k]=t; }); if(S.checks.length && S.checks.length<=N) delete S.deps[S.checks.length-1]; if(S.checks.length) S.deps[0]=S.checks[0]; }
const atStation = () => { const n=S.checks.length; return n>=1 && !finished() && S.deps[n-1]==null; };
const depOf = k => S.deps[k] ?? S.checks[k];
const stayAt = k => { const a=S.checks[k]; if(a==null) return 0; const d = S.deps[k] ?? (k===S.checks.length-1 && atStation() ? now() : a); return Math.max(0,d-a); };
const totalRest = t => { let x=restBefore(t); for(let k=1;k<S.checks.length && k<N;k++) x+=stayAt(k); return x; };

// ---------- 地図 ----------
const svg = document.getElementById("svg"), NS="http://www.w3.org/2000/svg";
const el = (t,a={},p=svg) => { const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); p.appendChild(e); return e; };
// 駅の位置（実際の形に近い模式図）
let POS=[], SIDE=[], GEOM=[], CXC=160, centerReady=false;
const LBL = {R:[12,4,"start"],L:[-12,4,"end"],T:[0,-11,"middle"],B:[0,19,"middle"],TL:[-9,-9,"end"],TR:[9,-8,"start"],BR:[9,15,"start"],BL:[-9,15,"end"]};
function computeLayout(){
  POS = ST.map(s=>[s[3],s[4]]); SIDE = ST.map(s=>s[5]); CXC = 160;
  GEOM = POS.map((_,i)=>{ const p0=POS[(i-1+N)%N], p1=POS[i], p2=POS[(i+1)%N], p3=POS[(i+2)%N];
    return [p1,[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6],[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6],p2].map(q=>q.map(v=>+v.toFixed(2))); });
}
const gSeg = el("g"), gCenter = el("g"), gSt = el("g");
const segEls = Array.from({length:N},()=>el("path",{class:"seg"},gSeg));
const stEls = ST.map((s,i)=>{
  const g = el("g",{class:"st"+(s[2]?" major":""),tabindex:"0",role:"button","aria-label":s[0]},gSt);
  el("circle",{class:"pulse",r:7},g);
  el("circle",{class:"start-ring",r:s[2]?11.5:10},g);
  el("circle",{class:"dot",r:s[2]?6.5:5},g);
  const t = el("text",{},g); t.textContent=s[0];
  el("circle",{class:"hit",r:14},g);
  g.addEventListener("click",()=>openSheet(i));
  g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();openSheet(i);} });
  return g;
});
function applyLayout(){
  computeLayout();
  GEOM.forEach((g,i)=>segEls[i].setAttribute("d",`M${g[0]}C${g[1]} ${g[2]} ${g[3]}`));
  stEls.forEach((g,i)=>{ const [x,y]=POS[i];
    g.querySelectorAll("circle").forEach(c=>{ c.setAttribute("cx",x); c.setAttribute("cy",y); });
    const o=LBL[SIDE[i]], t=g.querySelector("text"); t.setAttribute("x",x+o[0]); t.setAttribute("y",y+o[1]); t.setAttribute("text-anchor",o[2]); });
  if(centerReady){ [cTag,cBig,cCnt,cTl,cTime,cRest].forEach(e=>e.setAttribute("x",CXC)); hitC.setAttribute("x",CXC-70); hitT.setAttribute("x",CXC-80); }
}
applyLayout();
// 出発駅の目印（駅名を反転ラベルにして START を添える）
const gFlag = el("g",{class:"start-flag"});
const fRect = el("rect",{rx:6},gFlag);
const fName = el("text",{class:"sf-name"},gFlag);
const fCap = el("text",{class:"sf-cap"},gFlag); fCap.textContent="START";
function placeFlag(){
  const s = ST[S.start], t = stEls[S.start].querySelector("text");
  const x=+t.getAttribute("x"), y=+t.getAttribute("y"), a=t.getAttribute("text-anchor");
  fName.textContent = s[0];

let selected = null;
function render(){
  const r = route(), n = S.checks.length;
  // segments
  segEls.forEach(e=>e.setAttribute("class","seg"));
  for(let k=0;k<N;k++){
    const e = segEls[segIdx(k)];
    if(n>k+1) e.setAttribute("class","seg done");
    else if(n===k+1 && !finished() && !atStation()) e.setAttribute("class","seg walking");
  }
  // stations
  const stepOf = {}; r.slice(0,N).forEach((st,k)=>stepOf[st]=k);
  stEls.forEach((g,i)=>{
    const k = stepOf[i]; const c = ["st"]; if(ST[i][2]) c.push("major");
    if(n>k) c.push("done");
    if(i===S.start) c.push("start");
    if(!finished() && !atStation() && r[n]===i) c.push("next");
    if(selected===i) c.push("sel");
    g.setAttribute("class",c.join(" "));
  });
  // center
  const visited = Math.min(n, N);
  cBigN.textContent = pctNow();
  cCnt.textContent = visited+" / 30 駅";
  cTag.textContent = finished() ? "一周達成！" : n===0 ? "" : (S.dir==="inner"?"内回り":"外回り")+"・"+ST[S.start][0]+"発";
  cBig.style.display = n===0 ? "none" : "";
  cCnt.setAttribute("y", n===0 ? 270 : 298);
  if(n===0){ const nx=ST[route()[1]][0]; cCnt.textContent = (S.dir==="inner"?"内回り":"外回り")+"で "+nx+" 方面へ"; }
  fitW(cCnt,118); fitW(cTag);
  placeFlag(); renderProgress(); renderNext(); renderReview(); renderStats(); renderLog(); renderSettings();
}

// 画面が見えている間だけ秒単位で更新。隠れたら止め、戻ったら実時刻から計算し直す
let timer = null;
function tick(){
  const n=S.checks.length, t=nowT();
  const leg = S.timeMode==="leg" && n>0 && !finished(), r=route();
  if(n===0){ // 出発前：出発駅を主役に
    const nm=ST[S.start][0]; cTl.textContent="きょうのスタート";
    cTime.textContent=nm; cTime.classList.add("c-name"); cTime.style.fill=""; fitTime(); fitW(cTime); fitW(cTl);
    cRest.textContent=""; cRest.style.fill="";
    return; }
  if(cTime.classList.contains("c-name")){ cTime.classList.remove("c-name"); cTime.style.fontSize=""; delete cTime.dataset.fitFor; }
  cTl.textContent = !leg ? "スタートから ⇄" : atStation() ? ST[r[n-1]][0]+"に着いてから ⇄" : ST[r[n-1]][0]+"を出てから ⇄";
  fitW(cTl);
  cTime.textContent = n===0 ? "-:--:--" : leg ? fmtDur(t - (atStation() ? S.checks[n-1] : depOf(n-1))) : fmtDur(elapsed(t));
  cTime.style.fill = leg ? "var(--ink)" : ""; fitTime();
  cRest.textContent = paused() ? "休憩中" : atStation() ? ST[r[n-1]][0]+"に滞在中" : "";
  cRest.style.fill = atStation() ? "var(--muted)" : ""; fitW(cRest,118);
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set("sRest", n===0 ? "—" : fmtDur(totalRest(t)));
  set("restNow", fmtDur(curRest()));
  schedule();
}
function schedule(){
  clearTimeout(timer); timer = null;
  if(!started() || finished() || document.hidden) return;
  timer = setTimeout(tick, 1000 - ((now() - S.checks[0]) % 1000) + 15);
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ clearTimeout(timer); timer=null; } else render(); });

// ---------- ふりかえり（区間ランキングなど。記録が変わったときだけ計算） ----------
function renderReview(){
  const n=S.checks.length, r=route(), box=document.getElementById("review");
  const legs=[]; for(let k=1;k<n;k++) legs.push({k, from:ST[r[k-1]][0], to:ST[r[k]][0], d:S.checks[k]-depOf(k-1), rest:restIn(depOf(k-1),S.checks[k])});
  if(!finished()){ box.hidden=true; return; } // ゴールしてから全体をまとめて表示
  box.hidden=false;
  const max=Math.max(...legs.map(l=>l.d));
  const row=(l,j)=>`<li><span class="no">${j+1}</span><span class="nm">${l.from} → ${l.to}${l.rest>=60000?`<small>うち休憩 ${fmtMin(l.rest)}</small>`:""}<span class="tr"><i style="width:${Math.max(4,Math.round(l.d/max*100))}%"></i></span></span><span class="v">${fmtMin(l.d)}</span></li>`;
  const slow=[...legs].sort((a,b)=>b.d-a.d).slice(0,3);
  const fast=[...legs].sort((a,b)=>a.d-b.d).slice(0,3);
  // 長く休んだ駅
  let restTop=null; for(let k=0;k<n && k<N;k++){ const end = k+1<n ? S.checks[k+1] : (finished()?S.checks[N]:now()); const x=(k>0?stayAt(k):0)+restIn(depOf(k),end); if(x>=60000 && (!restTop || x>restTop.x)) restTop={st:ST[r[k]][0],x}; }
  // 前半と後半のペース
  let paceTxt="";
  if(legs.length>=6){ const h=Math.floor(legs.length/2), avg=a=>a.reduce((s,l)=>s+l.d,0)/a.length;
    const a1=avg(legs.slice(0,h)), a2=avg(legs.slice(h)), diff=Math.round((a2-a1)/60000);
    paceTxt = diff>=2 ? `後半は1駅あたり${diff}分ゆっくりに。疲れが出てきたかも` : diff<=-2 ? `後半のほうが1駅あたり${-diff}分速い！ 調子が上がってきたね` : `前半も後半もほぼ同じペース。安定してるね`; }
  const slowest=slow[0];
  const st=stepsTotal();
  let stepRank="";
  if(st!=null){ const sl=legs.map((l,j)=>({...l, s:S.steps[l.k-1]})).filter(l=>l.s!=null).sort((a,b)=>b.s-a.s).slice(0,3), mx=sl.length?sl[0].s:1;
    stepRank = `<div><h3>歩数が多かった区間</h3><ol class="rank">${sl.map((l,j)=>`<li><span class="no">${j+1}</span><span class="nm">${l.from} → ${l.to}<span class="tr"><i style="width:${Math.max(4,Math.round(l.s/mx*100))}%"></i></span></span><span class="v">${fmtNum(l.s)}<small style="font-size:11px"> 歩</small></span></li>`).join("")}</ol></div>`; }
  const firstTired = (()=>{ for(let k=0;k<=N;k++){ const m=moodOf(k); if(m && m.lv<=2) return `${ST[r[k]][0]}あたりから疲れが出たね`; } return Object.keys(S.mood).length ? "最後まで元気だった！" : "調子の記録なし"; })();
  const moodTxt = firstTired;
  const say = `いちばんの難所は${slowest.from}→${slowest.to}の${fmtMin(slowest.d)}。30区間、ぜんぶ歩ききったね！`;
  document.getElementById("rv").innerHTML = `
    <p class="say">${say}</p>
    <div><h3>調子のうつりかわり</h3><div class="mstrip">${Array.from({length:N+1},(_,k)=>{ const m=moodOf(k); return `<i style="${m?`background:${m.c}`:""}" title="${ST[r[k]][0]}${m?"："+m.label:""}"></i>`; }).join("")}</div>
      <div class="mlegend"><span>${ST[S.start][0]}（出発）</span><span>${moodTxt}</span><span>ゴール</span></div></div>
    <div><h3>時間がかかった区間</h3><ol class="rank">${slow.map(row).join("")}</ol></div>
    <div><h3>スイスイ歩けた区間</h3><ol class="rank fast">${fast.map(row).join("")}</ol></div>
    ${stepRank}
    <div class="facts">
      ${st!=null?`<div class="fact wide">総歩数<b class="big">${fmtNum(st)} 歩</b></div>`:""}
      <div class="fact">いちばん長く休んだ駅<b>${restTop?`${restTop.st}（${fmtMin(restTop.x)}）`:"休まず歩ききった！"}</b></div>
      <div class="fact">ペースの変化<b>${paceTxt}</b></div>
    </div>
    ${stepBox()}`;
  bindStepBox();
}

// ---------- 歩数の取り込み（iPhoneのショートカット経由） ----------
// ショートカットは「きょうの歩数の記録（時刻と歩数）」をそのまま渡すだけ。区間への振り分けはアプリが行う
function parseStamp(t){
  const m=t.match(/(\d{4})\s*[\/年\-.]\s*(\d{1,2})\s*[\/月\-.]\s*(\d{1,2})\s*日?[^\d]*?(\d{1,2})\s*[:時]\s*(\d{2})(?:\s*[:分]\s*(\d{2}))?/);
  if(!m) return null; let h=+m[4]; if(/午後|PM|pm/.test(t) && h<12) h+=12; if(/午前|AM|am/.test(t) && h===12) h=0;
  return new Date(+m[1],+m[2]-1,+m[3],h,+m[5],+(m[6]||0)).getTime();
}
function stepBox(){
  const has = stepsTotal()!=null;
  return `<details class="stepbox"${has?"":" open"}><summary>${has?"歩数を取り込み直す":"iPhoneの歩数を取り込む"}</summary>
    <ol class="steps-how">
      <li><b>ショートカット「ぐるっと山手線 歩数」を実行</b><span>きょうの歩数の記録がコピーされます</span></li>
      <li><b>ここに貼り付けて取り込む</b>
        <textarea id="stIn" rows="3" placeholder="ここに貼り付け"></textarea>
        <button class="sbtn main" id="stImport">取り込む</button></li>
    </ol>
    <details class="howto"><summary>ショートカットの作り方（最初の1回だけ・約3分）</summary>${SHORTCUT_HOWTO}</details>
  </details>`;
}
function bindStepBox(){
  const b=document.getElementById("stImport"); if(!b) return;
  b.onclick=()=>{
    const raw=document.getElementById("stIn").value.trim(); if(!raw){ toast("ショートカットの結果を貼り付けてください"); return; }
    const arr=Array(N).fill(0); let used=0, read=0;
    raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
      const parts=l.split(/[;；]/); if(parts.length<2) return;
      const t=parseStamp(parts[0]), v=parseFloat(parts[parts.length-1].replace(/[^\d.]/g,""));
      if(t==null || isNaN(v)) return; read++;
      if(t<S.checks[0] || t>=S.checks[N]) return;               // 散歩の前後の歩数は数えない
      let k=0; while(k<N-1 && t>=S.checks[k+1]) k++;              // どの区間の歩数か
      arr[k]+=v; used++;
    });
    if(!read){ toast("歩数の記録を読み取れませんでした。貼り付けた内容を確かめてください"); return; }
    if(!used){ toast("散歩していた時間の歩数が見つかりませんでした。散歩した日に実行してください"); return; }
    S.steps=arr.map(Math.round); save(); render(); toast(`歩数を取り込みました（合計 ${fmtNum(stepsTotal())} 歩）`);
  };
}

</ol>

// 出発前：準備画面を開く ／ 歩行中：到着を記録して、やること画面を開く
function checkIn(){
  if(finished()) return;
  if(!started()){ openArrive(0); return; }
  const t = now();
  if(paused()) S.pauses[S.pauses.length-1].e = t; // 休憩中に到着したら自動で再開
  S.checks.push(t); save(); closeSheet(); render();
  if(finished()) celebrate(); else openArrive(S.checks.length-1);
}
// 駅を出発（ここから次の区間のタイマーが始まる）
function depart(){
  const t=now();
  if(!started()){ S.checks=[t]; S.deps={0:t}; }
  else if(atStation()) S.deps[S.checks.length-1]=t;
  save(); closeArrive(); render();
}
function undo(){
  const n=S.checks.length;
  if(n>=2 && !finished() && S.deps[n-1]!=null){ delete S.deps[n-1]; } // 出発を取り消して駅に戻る
  else { S.checks.pop(); delete S.deps[S.checks.length]; }
  if(!S.checks.length){ S.pauses=[]; S.deps={}; }
  else { const last=S.checks[S.checks.length-1]; S.pauses=S.pauses.filter(p=>p.s<last); }
  save(); render();
}
function togglePause(){
  if(!started() || finished() || atStation()) return;
  const t=now();
  if(paused()) S.pauses[S.pauses.length-1].e=t; else S.pauses.push({s:t,e:null});
  save(); render();
}

function openSheet(i){

  const done = k<n, isNext = !finished() && r[n]===i;

    else btn = `<button class="go" id="shGo">${ST[i][0]}を出発する</button>`;
  } else {

    info = done ? `<b>${fmtT(S.checks[k])}</b> に到着 ・ ${k===0?"出発駅":`<b>${k}駅目</b>`}${rs>=60000?` ・ ここで休憩 <b>${fmtMin(rs)}</b>`:""}`

    if(i===S.start && n===N) btn = `<button class="go" id="shGo">ゴールに到着！</button>`;

  let photoHtml = "";

    photoHtml += steps.map(st=>`<div class="phblock"><div class="phlabel">${steps.length>1?(st===0?"出発時の調子":"ゴール時の調子"):"着いたときの調子"}</div>${moodGrid(st)}</div>`).join("");
  }
  if(started() && (done || i===S.start)){
    if(i===S.start) photoHtml += block(i, finished()?"出発の写真":"") + (finished()?block("goal","ゴールの写真"):"");
    else photoHtml += block(i, "");
  }
  sh.innerHTML = `<div class="card" role="dialog" aria-label="${ST[i][0]}">
    <div class="top"><h3><small>${ST[i][1]}</small>${ST[i][0]}</h3><button class="x" id="shX" aria-label="閉じる">✕</button></div>
    <div class="info">${info}</div>${photoHtml}${btn}</div>`;
  sh.querySelectorAll("label[data-slot]").forEach(l=>l.onclick=()=>{ photoSt = l.dataset.slot==="goal" ? "goal" : +l.dataset.slot; sheetOpen = i; });
  sh.querySelectorAll("button[data-slot]").forEach(b=>b.onclick=()=>openViewer(b.dataset.slot==="goal" ? "goal" : +b.dataset.slot));
  bindMood(sh, ()=>openSheet(i));
  sh.hidden = false;
  sh.querySelector("#shX").onclick = closeSheet;
  const g = sh.querySelector("#shGo"); if(g) g.onclick = checkIn;
  const s = sh.querySelector("#shSet"); if(s) s.onclick = ()=>{ S.start=i; save(); closeSheet(); render(); };
  render();
}

const dbp = new Promise(res=>{
  try{
    const rq = indexedDB.open("yamanote-photos",1);
    rq.onupgradeneeded = ()=>rq.result.createObjectStore("p",{keyPath:"id",autoIncrement:true});
    rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>res(null); rq.onblocked = ()=>res(null);
  }catch(e){ res(null); }
});
const store = async mode => { const db=await dbp; return db ? db.transaction("p",mode).objectStore("p") : null; };
const req = r => new Promise((ok,ng)=>{ r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error); });

// 長辺1600pxのJPEGに縮小して容量を抑える
async function shrink(file){
  try{
    const url = URL.createObjectURL(file), img = new Image();
    img.src = url; await img.decode();
    const sc = Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    const b = await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    return b || file;
  }catch(e){ return file; }
}

    let s1 = await store("readwrite"); if(!s1) throw new Error("no-db");
    rec.id = await req(s1.add(rec));
    if(old){ try{ const s2=await store("readwrite"); await req(s2.delete(old.id)); }catch(e){} }

async function makeCard(){
  const btn=document.getElementById("mkCard"); if(btn){ btn.disabled=true; btn.textContent="作成中…"; }
  const F='"Zen Kaku Gothic New","Hiragino Sans",sans-serif', FN='"Barlow Semi Condensed","Zen Kaku Gothic New",sans-serif';

  const C={bg:"#F3F6EE",panel:"#FFFFFF",fg:"#18210F",muted:"#69735F",track:"#D9E0CF",line:"#86C232",ink:"#3D6B10"};
  const W=1080,H=1600, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d"), r=route(), t0=S.checks[0], t1=S.checks[N];
  const rr=(X,Y,w,h,rad)=>{ x.beginPath(); x.roundRect ? x.roundRect(X,Y,w,h,rad) : x.rect(X,Y,w,h); };

  const sc=1.78, ox=(W-340*sc)/2+6*sc - 10, oy=225+2*sc;
  x.save(); x.setTransform(sc,0,0,sc,ox,oy);

  x.textBaseline="alphabetic";
  ST.forEach((st,i)=>{
    const o={R:[12,4,"left"],L:[-12,4,"right"],T:[0,-11,"center"],B:[0,19,"center"],TL:[-9,-9,"right"],TR:[9,-8,"left"],BR:[9,15,"left"],BL:[-9,15,"right"]}[SIDE[i]];
    x.textAlign=o[2];

      const lx = o[2]==="left"?tx:o[2]==="right"?tx-w:tx-w/2;
      x.fillStyle=C.fg; rr(lx-5,ty-12.5,w+10,17,6); x.fill();

  x.fillStyle=C.ink; { const tx=fmtDur(t1-t0); let fs=84; x.font=`700 ${fs}px ${FN}`; while(x.measureText(tx).width>140*sc && fs>40){ fs-=2; x.font=`700 ${fs}px ${FN}`; } x.fillText(tx,cxp,oy+235*sc); }
  if(stepsTotal()!=null){ x.textAlign="center"; x.fillStyle=C.fg; x.font=`700 30px ${FN}`; x.fillText(fmtNum(stepsTotal())+" 歩",cxp,oy+262*sc); }
  // 出発・ゴール時刻
  const cols=[["出発",fmtT(t0)],["ゴール",fmtT(t1)],["休憩・滞在",fmtMin(totalRest(t1))]];

    x.fillStyle=C.muted; x.font=`700 24px ${F}`; x.fillText(c[0],cx,1135);
    x.fillStyle=C.fg; x.font=`700 54px ${FN}`; x.fillText(c[1],cx,1192); });
  // 写真（歩いた順に30マス）
  const cell=96, gap=6, gx=(W-(cell*10+gap*9))/2, gy=1225;
  for(let k=0;k<N;k++){
    const i=r[k], X=gx+(k%10)*(cell+gap), Y=gy+Math.floor(k/10)*(cell+gap);

// ファイルを渡す：claude.ai では保存機能、PWA では iPhone の共有シート、PC ではダウンロード
const canShareFile = f => { try{ return !!(navigator.canShare && navigator.canShare({files:[f]})); }catch(e){ return false; } };
async function saveFile(name, blob, type){
  if(DL){ try{ await DL.save({filename:name, data:blob}); return "ok"; }catch(e){ if(e && e.code==="declined") return "cancel"; } }
  const f = new File([blob], name, {type});
  if(canShareFile(f)){ try{ await navigator.share({files:[f]}); return "ok"; }catch(e){ if(e && e.name==="AbortError") return "cancel"; } }
  if(!window.claude){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return "ok"; }
  return "fail";
}

// ゴール演出
// ゴール演出：約5秒だけ動いて完全に止まる（常時アニメーションはなし）
function celebrate(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t0=S.checks[0], t1=S.checks[N];
  const ce=document.getElementById("cele");
  ce.innerHTML=`<div class="box"><div class="s1">30駅 ぜんぶ歩いた！</div><div class="s2">山手線<br>一周達成</div><div class="s3">${fmtDur(t1-t0)}</div><div class="s4">タップで閉じる</div></div>`;
  ce.hidden=false;
  const close=()=>{ if(ce.hidden) return; ce.hidden=true; ce.innerHTML=""; clearTimeout(close.t); if(finished() && !S.mood[N]) openArrive(N); };
  ce.onclick=close; close.t=setTimeout(close,6000);
  svg.classList.add("svg-cele"); setTimeout(()=>svg.classList.remove("svg-cele"),3000);
  if(reduce) return;
  const cv=document.getElementById("fx"), ctx=cv.getContext("2d");
  const dpr=Math.min(2,devicePixelRatio||1), W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px"; ctx.scale(dpr,dpr); cv.hidden=false;
  const cols=["#86C232","#9ACD32","#3D6B10","#F2C230","#E5785B","#FFFFFF"];
  const ps=[];
  const add=(x,y,ang,spread,sp,n)=>{ for(let k=0;k<n;k++){ const a=ang+(Math.random()-.5)*spread, v=sp*(.55+Math.random()*.6);
    ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6,vr:(Math.random()-.5)*.4,s:5+Math.random()*6,c:cols[k%cols.length],life:1}); } };
  // 左右の下から紙吹雪の大砲、続けて空に花火を3発
  add(0,H,-Math.PI/3,.7,19,90); add(W,H,-Math.PI*2/3,.7,19,90);
  const bursts=[[W*.3,H*.28,500],[W*.72,H*.22,1100],[W*.5,H*.36,1700]];
  const start=performance.now(); let bi=0;
  (function f(t){
    const el=t-start;
    while(bi<bursts.length && el>=bursts[bi][2]){ const [bx,by]=bursts[bi]; add(bx,by,0,Math.PI*2,8,60); bi++; }
    ctx.clearRect(0,0,W,H);
    for(const p of ps){ p.vy+=.32; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(el>3800) p.life-=.03;
      if(p.y>H+20||p.life<=0) continue;
      ctx.globalAlpha=Math.max(0,p.life); ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }
    ctx.globalAlpha=1;
    if(el<5000) requestAnimationFrame(f); else { ctx.clearRect(0,0,W,H); cv.hidden=true; }
  })(start);
}

// ---------- 記録の書き出し・読み込み（別の場所や端末へ引っ越すとき用。写真も含む） ----------
const blobToData = b => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.onerror=()=>r(null); fr.readAsDataURL(b); });
document.getElementById("bkOut").onclick = async ()=>{
  const photos=[];
  try{ const st=await store("readonly"); if(st){ for(const rec of await req(st.getAll())){ const d=await blobToData(rec.blob); if(d) photos.push({st:rec.st ?? stOf(rec), ts:rec.ts, data:d}); } } }catch(e){}
  const json=JSON.stringify({app:"gurutto-yamanote", version:1, exported:Date.now(), state:S, photos});
  const d=new Date(), z=x=>String(x).padStart(2,"0");
  const r=await saveFile(`gurutto-yamanote-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}.json`, new Blob([json],{type:"application/json"}), "application/json");
  if(r==="ok") toast(`記録を書き出しました（写真 ${photos.length}枚）`); else if(r==="fail") toast("書き出せませんでした");
};
const bkIn=document.getElementById("bkIn"), bkC=document.getElementById("bkConfirm");
bkIn.onchange = async ()=>{
  const f=bkIn.files[0]; bkIn.value=""; if(!f) return;
  let data; try{ data=JSON.parse(await f.text()); }catch(e){ toast("このファイルは読み込めませんでした"); return; }
  if(!data || data.app!=="gurutto-yamanote" || !data.state || !Array.isArray(data.state.checks)){ toast("ぐるっと山手線の記録ファイルではありません"); return; }
  const n=data.state.checks.length, ph=(data.photos||[]).length;
  bkC.innerHTML=`<div class="confirm"><span>${n?`${Math.min(n,N)}駅ぶんの記録`:"出発前の記録"}・写真${ph}枚で、今の記録を置き換えますか？</span><button class="yes" id="bkY">置き換える</button><button class="no" id="bkN">やめる</button></div>`;
  bkC.querySelector("#bkN").onclick=()=>{ bkC.innerHTML=""; };
  bkC.querySelector("#bkY").onclick=async ()=>{
    bkC.innerHTML="";
    await clearPhotos();
    for(const p of data.photos||[]){ try{ const b=await (await fetch(p.data)).blob(); const st=await store("readwrite"); if(!st) break; const rec={st:p.st, ts:p.ts, blob:b}; rec.id=await req(st.add(rec)); addToMem(rec); }catch(e){} }
    S = Object.assign({start:0, dir:"inner", checks:[], pauses:[], mood:{}, deps:{}}, data.state, {intro:true});
    save(); syncTest(); applyLayout(); render(); toast("記録を読み込みました");
  };
};

// ---------- はじめての人への案内（初回だけ表示。設定の「使い方を見る」でいつでも） ----------
const INTRO = [
  {h:"ぐるっと山手線へようこそ", p:"山手線の30駅を歩いて一周する日のための記録アプリです。着いた駅をたどりながら、ゴールの出発駅を目指します。",
   art:`<svg viewBox="0 0 160 160" width="170" height="170" aria-hidden="true"><ellipse cx="80" cy="80" rx="52" ry="66" fill="none" stroke="var(--track)" stroke-width="10"/><path d="M132 80 A52 66 0 0 0 80 14" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/><circle cx="132" cy="80" r="9" fill="var(--surface)" stroke="var(--fg)" stroke-width="3"/><circle cx="80" cy="14" r="7" fill="var(--line)" stroke="var(--surface)" stroke-width="3"/><text x="80" y="88" text-anchor="middle" font-family="Barlow Semi Condensed, sans-serif" font-weight="700" font-size="26" fill="var(--ink)">30駅</text></svg>`},
  {h:"出発駅と向きを決める", p:"路線図の駅をタップすると、その駅を出発駅にできます。内回り・外回りは右上の「設定」で選べます。",
   art:`<div class="mini"><div class="chip s">路線図の駅をタップ</div><div class="arw">▼</div><div class="chip s">「ここを出発駅にする」</div><div class="arw">▼</div><div class="chip g">〇〇から出発する</div></div>`},
  {h:"駅に着いたら「到着！」", p:"画面下のボタンを押すと、その駅でのやることが開きます。調子と駅名看板の写真を残してから「出発！」で次の駅へ。前の駅からの時間は、出発を押したときから数えます。",
   art:`<div class="mini"><div class="chip g">〇〇に到着！</div><div class="arw">▼</div><div class="row2"><div class="chip s">いまの調子</div><div class="chip s">駅の写真</div></div><div class="arw">▼</div><div class="chip g">つぎの駅へ出発！</div></div>`},
  {h:"休憩も、ふりかえりも", p:"歩いている途中は「休憩」で休んだ時間を残せます。路線図の真ん中の時間をタップすると、前の駅からの時間に切り替わります。ゴールすると、一周のふりかえりと完歩カードが作れます。",
   art:`<div class="mini"><div class="row2"><div class="chip s">休憩</div><div class="chip s">時間をタップ ⇄</div></div><div class="arw">▼</div><div class="chip g">ふりかえり・完歩カード</div></div>`}
];
function showIntro(i=0){
  const box=document.getElementById("intro"), it=INTRO[i], last=i===INTRO.length-1;
  box.innerHTML=`<button class="skip" id="inSkip">${last?"":"スキップ"}</button>
    <div class="slide"><div class="art">${it.art}</div><h2>${it.h}</h2><p>${it.p}</p></div>
    <div class="nav"><div class="dots">${INTRO.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
    <button class="go" id="inNext">${last?"はじめる":"次へ"}</button></div>`;
  box.hidden=false; document.body.style.overflow="hidden";
  const done=()=>{ box.hidden=true; box.innerHTML=""; document.body.style.overflow=""; S.intro=true; save(); };
  box.querySelector("#inNext").onclick=()=> last ? done() : showIntro(i+1);
  box.querySelector("#inSkip").onclick=done;
}
document.getElementById("showIntro").onclick=()=>showIntro(0);

// テストモード（画面）
const tmChk=document.getElementById("tmChk"), testbar=document.getElementById("testbar");
function syncTest(){
  tmChk.checked=!!S.test; testbar.hidden=!S.test;
  tmChk.disabled = !!S.test && started() && (S.tOff||0)>0; // 早送り後の記録が残っている間は解除しない
  const m=Math.round((S.tOff||0)/60000); document.getElementById("tOff").textContent=Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
}
tmChk.onchange=()=>{ S.test=tmChk.checked; if(!S.test) S.tOff=0; save(); syncTest(); render(); };
testbar.querySelectorAll("button[data-add]").forEach(b=>b.onclick=()=>{ S.tOff=(S.tOff||0)+(+b.dataset.add)*60000; save(); syncTest(); render(); });
// ゴールまでスキップ：残りの区間を、それらしい所要時間・滞在・休憩・調子つきで自動で記録する
const tGoal=document.getElementById("tGoal");
tGoal.onclick=()=>{
  if(finished()) return;
  if(!tGoal.dataset.arm){ tGoal.dataset.arm="1"; tGoal.textContent="もう一度押すと実行"; setTimeout(()=>{ delete tGoal.dataset.arm; tGoal.textContent="ゴールまで"; },3000); return; }
  delete tGoal.dataset.arm; tGoal.textContent="ゴールまで";
  const rnd=(a,b)=>Math.round((a+Math.random()*(b-a))*60000);
  const ids=MOODS.map(m=>m.id); let t=now();
  if(paused()) S.pauses[S.pauses.length-1].e=t;
  if(!started()){ S.checks=[t]; S.deps={0:t}; }
  while(!finished()){
    const n=S.checks.length;
    if(atStation()){ t+=rnd(1,6); S.deps[n-1]=t; continue; }
    const dep=t; t+=rnd(9,26);
    if(Math.random()<0.15){ const ps=dep+rnd(3,8); const pe=ps+rnd(5,15); S.pauses.push({s:ps,e:pe}); t+=pe-ps; }
    S.checks.push(t);
    if(!S.mood[n]){ const lv = n<10 ? ids.slice(0,4) : n<20 ? ids.slice(2,6) : ids.slice(3); S.mood[n]=lv[Math.floor(Math.random()*lv.length)]; }
  }
  S.tOff=(S.tOff||0)+(t-now());
  save(); closeSheet(); closeArrive(); syncTest(); render(); celebrate();
};
syncTest();

render();
loadPhotos();
if(!S.intro && !started()) showIntro(0);
try{ document.fonts.ready.then(()=>{ document.querySelectorAll('[data-fit-for]').forEach(e=>{ delete e.dataset.fitFor; }); placeFlag(); render(); }); }catch(e){}
</script>

  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
